  --black:#0b0910;--purple-deep:#1d1030;--purple:#3a1f5e;--lilac:#c58ee6;--white:#ffffff;--muted:#b9b1c7;

}
*{box-sizing:border-box;margin:0;padding:0}

.draftbar{background:var(--purple-deep);border-bottom:1px solid var(--purple);padding:10px 20px;font-size:12.5px;position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
.draftbar strong{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--lilac)}
.draftbar label{display:flex;gap:8px;align-items:center}
.draftbar input[type=range]{width:130px;accent-color:var(--lilac)}
.draftbar select,.draftbar button{font:inherit;color:var(--white);background:var(--black);border:1px solid var(--purple);border-radius:999px;padding:5px 12px;cursor:pointer}
.draftbar output{color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}
#line{flex-basis:100%;color:var(--muted)}#line span{color:var(--white)}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:22px var(--edge)}
.brand{font-family:"Cinzel",serif;letter-spacing:.2em;font-size:15px;text-transform:uppercase;text-decoration:none}
nav ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px 30px;margin-right:-.22em}

main{padding:40px var(--edge) 110px}

.grid{column-count:var(--cols);column-gap:var(--gap)}
.ph{display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in;margin:0 0 var(--gap);break-inside:avoid;overflow:hidden}
.ph img{width:100%;height:auto;transition:transform .8s ease,opacity .4s}
.ph:hover img{transform:scale(1.03)}
.grid.crop{column-count:auto;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap)}
.grid.crop .ph{margin:0;aspect-ratio:var(--ar)}
.grid.crop .ph img{height:100%;object-fit:cover}
#lb{position:fixed;inset:0;z-index:50;background:rgba(11,9,16,.94);display:flex;align-items:center;justify-content:center;padding:4vmin}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;font:inherit;color:var(--white);background:rgba(11,9,16,.6);border:1px solid var(--lilac);border-radius:999px;width:46px;height:46px;font-size:20px;cursor:pointer}
#lbx{top:18px;right:18px}#lbp{left:18px;top:50%}#lbn{right:18px;top:50%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
  var KEY='yk-gallery-v2',root=document.documentElement,grid=document.getElementById('grid');
  var c=document.getElementById('gCols'),g=document.getElementById('gGap'),s=document.getElementById('gShape'),t=document.getElementById('gTitle');
  function apply(){
    root.style.setProperty('--cols',c.value);root.style.setProperty('--gap',g.value+'px');root.style.setProperty('--s-title',t.value/100);
    var crop=s.value!=='natural';grid.classList.toggle('crop',crop);if(crop)root.style.setProperty('--ar',s.value);
    document.getElementById('oCols').textContent=c.value;document.getElementById('oGap').textContent=g.value+'px';document.getElementById('oTitle').textContent=t.value+'%';
    document.getElementById('txt').textContent='Gallery: '+c.value+' columns, gap '+g.value+'px, photo shape '+s.options[s.selectedIndex].text+', title size '+t.value+'%.';
    try{localStorage.setItem(KEY,JSON.stringify([c.value,g.value,s.value,t.value]));}catch(e){}
  }
  try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){c.value=v[0];g.value=v[1];s.value=v[2];t.value=v[3];}}catch(e){}
  [c,g,s,t].forEach(function(x){x.addEventListener('input',apply);x.addEventListener('change',apply);});apply();
  document.getElementById('copy').addEventListener('click',function(){var b=this;try{navigator.clipboard.writeText(document.getElementById('txt').textContent).then(function(){b.textContent='Copied';},function(){b.textContent='Select the text';});}catch(e){b.textContent='Select the text';}});
  var ph=[].slice.call(document.querySelectorAll('.ph')),lb=document.getElementById('lb'),lbi=document.getElementById('lbi'),cur=0;
  function open(i){cur=(i+ph.length)%ph.length;var im=ph[cur].querySelector('img');lbi.src=im.getAttribute('src');lbi.alt=im.alt;lb.hidden=false;}
  ph.forEach(function(b,i){b.addEventListener('click',function(){open(i)})});
  document.getElementById('lbx').addEventListener('click',function(){lb.hidden=true});
  document.getElementById('lbp').addEventListener('click',function(e){e.stopPropagation();open(cur-1)});
  document.getElementById('lbn').addEventListener('click',function(e){e.stopPropagation();open(cur+1)});
  lb.addEventListener('click',function(e){if(e.target===lb)lb.hidden=true});
  document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')lb.hidden=true;if(e.key==='ArrowLeft')open(cur-1);if(e.key==='ArrowRight')open(cur+1);});
})();
</script>
