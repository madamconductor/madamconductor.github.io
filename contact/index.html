<script>
(function(){
  var KEY='yk-contact-v5',root=document.documentElement,main=document.getElementById('top');
  var ids=['kSide','kBox','kAcc','kTitle','kEmail','kLogo','kW','fLs','fTxt','fTc','fBtn','fBs','fPs','fNote','nLab','nLine','nLinec','nLen','nPad','nSb','eLab','eLine','eLinec','eLen','ePad','eSb','mLab','mLine','mLinec','mLen','mPad','mSb'],E={};ids.forEach(function(i){E[i]=document.getElementById(i)});
  function apply(){
    main.classList.toggle('flip',E.kSide.value==='left');
    root.style.setProperty('--c-box',E.kBox.value);root.style.setProperty('--c-accent',E.kAcc.value);
    root.style.setProperty('--s-title',E.kTitle.value/100);root.style.setProperty('--s-email',E.kEmail.value/100);
    root.style.setProperty('--is',E.kLogo.value+'px');root.style.setProperty('--bwfr',(E.kW.value/100*1.1).toFixed(2)+'fr');
    var v=function(k,x){root.style.setProperty(k,x)};
    v('--f-ls',(E.fLs.value/100)+'em');v('--f-txt',E.fTxt.value+'px');v('--f-tc',E.fTc.value);v('--f-btn',E.fBtn.value+'px');v('--f-bs',E.fBs.value/100);v('--f-ps',E.fPs.value/100);v('--f-note',E.fNote.value+'px');
    [['n','fName'],['e','fEmail'],['m','fMsg']].forEach(function(f){var k=f[0],lab=document.getElementById(f[1]).parentNode,w=lab.style;
      w.setProperty('--ls-sz',E[k+'Lab'].value+'px');w.setProperty('--lt',E[k+'Line'].value+'px');w.setProperty('--lc',E[k+'Linec'].value);w.setProperty('--lw',E[k+'Len'].value+'%');w.setProperty('--pad',E[k+'Pad'].value+'px');w.setProperty('--sb',E[k+'Sb'].value+'px');});
    var m=document.getElementById('fMsg');if(m&&m.value){m.style.height='auto';m.style.height=m.scrollHeight+'px';}
    document.getElementById('txt').textContent='Contact: form on the '+E.kSide.value+', box '+E.kBox.value+', labels and button '+E.kAcc.value+', title size '+E.kTitle.value+'%, email size '+E.kEmail.value+'%, logo size '+E.kLogo.value+'px, form width '+E.kW.value+'%, '+[['Name','n'],['Email','e'],['Message','m']].map(function(f){var k=f[1];return f[0]+' line: label '+E[k+'Lab'].value+'px, thickness '+E[k+'Line'].value+'px, colour '+E[k+'Linec'].value+', length '+E[k+'Len'].value+'%, height '+E[k+'Pad'].value+', space below '+E[k+'Sb'].value+'px'}).join('; ')+'; label spacing '+E.fLs.value+', typed text '+E.fTxt.value+'px in '+E.fTc.value+', button text '+E.fBtn.value+'px, button size '+E.fBs.value+'%, box padding '+E.fPs.value+'%, note text '+E.fNote.value+'px.';
    try{var s={};ids.forEach(function(i){s[i]=E[i].value});localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}
  }
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)ids.forEach(function(i){if(s[i]!=null)E[i].value=s[i]});}catch(e){}
  ids.forEach(function(i){E[i].addEventListener('input',apply);E[i].addEventListener('change',apply);});apply();
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var f=this,note=document.getElementById('sent'),btn=f.querySelector('button[type=submit]');
    function say(t){note.textContent=t;note.hidden=false;}
    if(f.access_key.value.indexOf('YOUR_ACCESS_KEY')===0){say('Draft only: the form will send messages once the site is live.');return;}
    if(!f.name.value.trim()||!/^\S+@\S+\.\S+$/.test(f.email.value.trim())||!f.message.value.trim()){say('Please add your name, a valid email and a message.');return;}
    btn.disabled=true;say('Sending...');
    fetch(f.action,{method:'POST',headers:{'Accept':'application/json'},body:new FormData(f)})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok&&d.success,d:d}})})
      .then(function(x){if(x.ok){f.reset();var m=document.getElementById('fMsg');m.style.height='';say('Thank you, your message has been sent. I will reply soon.');}else{say('Sorry, that did not send. Please email yaashvikedia@gmail.com directly.');}btn.disabled=false;})
      .catch(function(){say('Sorry, that did not send. Please email yaashvikedia@gmail.com directly.');btn.disabled=false;});
  });
  document.getElementById('copy').addEventListener('click',function(){var b=this;try{navigator.clipboard.writeText(document.getElementById('txt').textContent).then(function(){b.textContent='Copied';},function(){b.textContent='Select the text';});}catch(e){b.textContent='Select the text';}});
})();
(function(){var m=document.getElementById('fMsg');if(!m)return;function g(){m.style.height='auto';m.style.height=m.scrollHeight+'px';}m.addEventListener('input',g);})();</script>
